services:
  web:
    build: .
    container_name: fairpanel_web
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_DB_PATH=/app/data/fairpanel.sqlite3
      - PORT=8080
    volumes:
      - fairpanel_data:/app/data
      - fairpanel_media:/app/media
    restart: unless-stopped

volumes:
  fairpanel_data:
  fairpanel_media:
